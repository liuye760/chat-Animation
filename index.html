<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码道小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #e5e5e5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .phone {
    width: 375px;
    height: 720px;
    display: flex;
    flex-direction: column;
    background: #ededed;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
  }

  .titlebar {
    flex: none;
    height: 56px;
    margin: 10px 10px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-radius: 16px;
    background: linear-gradient(135deg, #101223 0%, #1b1030 100%);
    border: 1px solid rgba(0, 240, 255, 0.45);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.28), 0 0 22px rgba(255, 47, 179, 0.22), inset 0 0 12px rgba(0, 240, 255, 0.16);
  }

  .titlebar .title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #f2fbff;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.75), 0 0 12px rgba(255, 47, 179, 0.45);
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: #c4c4c4 transparent;
  }

  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb {
    background: #c4c4c4;
    border-radius: 2px;
  }
  .chat::-webkit-scrollbar-track { background: transparent; }

  .time-pill {
    align-self: center;
    flex: none;
    padding: 3px 10px;
    border-radius: 11px;
    background: rgba(0, 0, 0, 0.06);
    color: #8a8a8a;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.2px;
    animation: bubbleIn 0.28s ease-out both;
  }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: bubbleIn 0.28s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .msg.me {
    justify-content: flex-end;
  }

  .avatar {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    user-select: none;
  }

  .avatar.bot {
    background: linear-gradient(140deg, #5fd0c4, #2b9a90);
  }

  .avatar.me {
    background: linear-gradient(140deg, #92b7ea, #5b82c5);
  }

  .bubble {
    position: relative;
    max-width: 68%;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.5;
    color: #000;
    word-break: break-word;
  }

  .msg.other .bubble {
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.05);
  }

  .msg.other .bubble::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 13px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 6px solid #fff;
  }

  .msg.me .bubble {
    background: linear-gradient(135deg, #5ffbf1 0%, #9d8cff 50%, #ff8fe0 100%);
    color: #08131a;
    box-shadow: 0 0 6px rgba(95, 251, 241, 0.55), 0 0 14px rgba(255, 143, 224, 0.45), 0 2px 6px rgba(0, 0, 0, 0.18);
  }

  .msg.me .bubble::before {
    content: "";
    position: absolute;
    right: -6px;
    top: 13px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 6px solid #ff9fdc;
  }

  .msg.typing .bubble {
    display: inline-flex;
    align-items: center;
    padding: 9px 13px;
    color: #07c160;
    font-size: 14px;
  }

  .msg.typing .dots {
    display: inline-flex;
    margin-left: 1px;
  }

  .msg.typing .dots span {
    width: 5px;
    text-align: center;
    opacity: 0;
    animation: dotFade 1.2s infinite;
  }

  .msg.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .msg.typing .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(10px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes dotFade {
    0%, 25%   { opacity: 0; }
    50%, 100% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .time-pill { animation: none; }
    .msg.typing .dots span { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="phone">
    <header class="titlebar">
      <span class="title">码道小助手</span>
    </header>

    <main class="chat">
      <div class="time-pill">今天 14:20</div>
      <div class="msg other">
        <div class="avatar bot">码</div>
        <div class="bubble">在吗？</div>
      </div>
      <div class="msg me">
        <div class="bubble">在的，怎么啦？</div>
        <div class="avatar me">我</div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const chat = document.querySelector('.chat');

      const script = [
        { from: 'other', text: '在吗？' },
        { from: 'me', text: '在的，怎么啦？' },
        { from: 'other', text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？' },
        { from: 'me', text: '对，思路很简单' },
        { from: 'me', text: '满意就 commit，不满意就 checkout / reset 回退再改' },
        { from: 'other', text: '懂了，那我先去试试' },
        { from: 'me', text: '👍 有不懂的随时问' }
      ];

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function scrollToBottom() {
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
      }

      function addTimePill(text) {
        const pill = document.createElement('div');
        pill.className = 'time-pill';
        pill.textContent = text;
        chat.appendChild(pill);
      }

      function avatarOf(from) {
        const avatar = document.createElement('div');
        avatar.className = 'avatar ' + (from === 'me' ? 'me' : 'bot');
        avatar.textContent = from === 'me' ? '我' : '码';
        return avatar;
      }

      function addMessage(from, text) {
        const row = document.createElement('div');
        row.className = 'msg ' + from;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        if (from === 'me') {
          row.appendChild(bubble);
          row.appendChild(avatarOf(from));
        } else {
          row.appendChild(avatarOf(from));
          row.appendChild(bubble);
        }

        chat.appendChild(row);
        scrollToBottom();
        return row;
      }

      async function showTyping(hold) {
        const row = document.createElement('div');
        row.className = 'msg other typing';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.appendChild(document.createTextNode('对方正在输入'));

        const dots = document.createElement('span');
        dots.className = 'dots';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('span');
          dot.textContent = '.';
          dots.appendChild(dot);
        }
        bubble.appendChild(dots);

        row.appendChild(avatarOf('other'));
        row.appendChild(bubble);
        chat.appendChild(row);
        scrollToBottom();

        await wait(hold);
        row.remove();
      }

      async function play() {
        while (true) {
          chat.scrollTop = 0;
          chat.innerHTML = '';
          addTimePill('今天 14:20');
          await wait(500);

          for (const line of script) {
            if (line.from === 'other') {
              await showTyping(1300);
            }
            addMessage(line.from, line.text);
            await wait(line.from === 'other' ? 1000 : 850);
          }

          await wait(2600);
        }
      }

      play();
    })();
  </script>
</body>
</html>
